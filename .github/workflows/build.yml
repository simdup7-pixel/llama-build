name: Build libllamabridge

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name proyek Sketchware"
        required: true
        default: "com.my.newproject"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ambil llama.cpp
        run: git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp jni/llama.cpp

      - name: Build arm64
        env:
          PKG: ${{ inputs.package }}
        run: |
          CLASS="$(echo "$PKG" | tr . /)/LlamaBridge"
          cmake -S jni -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBRIDGE_CLASS="$CLASS"
          cmake --build build --config Release -j$(nproc) --target llamabridge

      - uses: actions/upload-artifact@v4
        with:
          name: libllamabridge
          path: build/libllamabridge.so
